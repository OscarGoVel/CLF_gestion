{# Sub-nav de Herramientas #}
<div class="bg-[#f0f4fa] border-b border-[#d9e2f0] flex items-center px-5 gap-1 h-9 select-none">
    <a href="/analisis"
       class="px-4 h-full flex items-center text-xs font-semibold transition-colors rounded-t
              {% if seccion != 'costos' %}text-clf-green border-b-2 border-clf-green bg-white
              {% else %}text-navy-400 hover:text-navy-700{% endif %}">
        Análisis
    </a>
    {% if user.rol == 'Administrador' %}
    <a href="/analisis/costos"
       class="px-4 h-full flex items-center text-xs font-semibold transition-colors rounded-t
              {% if seccion == 'costos' %}text-clf-green border-b-2 border-clf-green bg-white
              {% else %}text-navy-400 hover:text-navy-700{% endif %}">
        Costos
    </a>
    <a href="/estado-cuenta"
       class="px-4 h-full flex items-center text-xs font-semibold transition-colors rounded-t
              {% if seccion == 'estado_cuenta' %}text-clf-green border-b-2 border-clf-green bg-white
              {% else %}text-navy-400 hover:text-navy-700{% endif %}">
        Estado de Cuenta
    </a>
    {% endif %}
    {% if user.rol in ('Administrador', 'Operador') %}
    <a href="/estudio-mercado"
       class="px-4 h-full flex items-center text-xs font-semibold transition-colors rounded-t
              {% if seccion == 'estudio_mercado' %}text-clf-green border-b-2 border-clf-green bg-white
              {% else %}text-navy-400 hover:text-navy-700{% endif %}">
        Estudio de Mercado
    </a>
    {% endif %}
</div>
