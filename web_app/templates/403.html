{% extends "base.html" %}
{% block title %}Sin permiso — CLF Gestión{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center bg-navy-700">
    <div class="text-center max-w-sm">
        <div class="text-7xl mb-4">🔒</div>
        <h1 class="text-5xl font-bold text-white mb-2">403</h1>
        <p class="text-navy-400 text-sm mb-1">Sin permiso</p>
        <p class="text-navy-400 text-xs mb-6">
            Tu rol no tiene acceso a <span class="text-clf-teal font-mono">{{ path }}</span>
        </p>
        {% if user %}
        <a href="/dashboard"
           class="inline-block bg-clf-green hover:bg-clf-green-dk text-white text-sm font-bold
                  px-6 py-2.5 rounded-lg transition-colors">
            Ir al Dashboard
        </a>
        {% else %}
        <a href="/"
           class="inline-block bg-clf-green hover:bg-clf-green-dk text-white text-sm font-bold
                  px-6 py-2.5 rounded-lg transition-colors">
            Iniciar sesion
        </a>
        {% endif %}
    </div>
</div>
{% endblock %}
