{% if error %}
<div class="flex items-start gap-3 bg-red-50 border border-red-200 rounded-xl px-4 py-3 text-sm text-red-700">
    <span class="text-lg">⚠</span>
    <div>
        <p class="font-semibold">Error</p>
        <p class="mt-0.5 text-xs">{{ error }}</p>
    </div>
</div>
{% else %}
<div class="flex items-start gap-3 rounded-xl px-4 py-3 text-sm
    {% if tipo == 'entrada' %}bg-green-50 border border-green-200 text-green-700
    {% else %}bg-red-50 border border-red-200 text-red-700{% endif %}">
    <span class="text-lg">{% if tipo == 'entrada' %}▲{% else %}▼{% endif %}</span>
    <div>
        <p class="font-semibold">{{ 'Entrada' if tipo == 'entrada' else 'Salida' }} registrada</p>
        <p class="mt-0.5 text-xs">
            {{ producto }} · {{ cantidad }} uds · Stock actual: <strong>{{ stock_despues }}</strong>
        </p>
        <a href="/stock" class="inline-block mt-2 text-xs font-semibold underline hover:no-underline">
            Ver inventario →
        </a>
    </div>
</div>
{% endif %}
