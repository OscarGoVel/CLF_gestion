{# Modal reutilizable para Entrada y Salida #}

<!-- Modal Entrada -->
<div id="modal-entrada" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md mx-4 overflow-hidden">
        <div class="px-6 py-4 border-b border-green-100 bg-green-50 flex items-center justify-between">
            <h3 class="text-base font-bold text-green-700">▲ Registrar Entrada</h3>
            <button onclick="cerrarModal('modal-entrada')" class="text-gray-400 hover:text-gray-600 text-xl">✕</button>
        </div>
        <div class="px-6 py-5">
            <form hx-post="/stock/entrada" hx-target="#entrada-result" hx-swap="innerHTML" class="space-y-4">
                <div class="relative">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Producto</label>
                    <input type="text" id="buscar-entrada" placeholder="Buscar por nombre o código…" autocomplete="off"
                           hx-get="/stock/buscar-producto" hx-trigger="keyup changed delay:250ms"
                           hx-target="#sugerencias-entrada" hx-swap="innerHTML"
                           name="_buscar_entrada"
                           hx-vals='js:{"q": document.getElementById("buscar-entrada").value}'
                           class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg
                                  focus:outline-none focus:ring-2 focus:ring-green-400 bg-gray-50">
                    <input type="hidden" name="producto_id" id="producto_id_entrada" required>
                    <div id="sugerencias-entrada" class="relative"></div>
                    <p id="producto-seleccionado-entrada" class="mt-1 text-xs text-green-600 font-semibold hidden"></p>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Cantidad</label>
                        <input type="number" name="cantidad" min="0.01" step="0.01" required
                               class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg
                                      focus:outline-none focus:ring-2 focus:ring-green-400">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Motivo</label>
                        <input type="text" name="motivo" value="Compra" placeholder="Ej. Compra, Ajuste…"
                               class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg
                                      focus:outline-none focus:ring-2 focus:ring-green-400">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Referencia <span class="text-gray-400 font-normal">(opcional)</span></label>
                    <input type="text" name="referencia" placeholder="Folio de compra, OC…"
                           class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg
                                  focus:outline-none focus:ring-2 focus:ring-green-400">
                </div>
                <div id="entrada-result"></div>
                <div class="flex gap-3">
                    <button type="submit"
                            class="flex-1 py-2 bg-green-600 text-white text-sm font-semibold rounded-lg
                                   hover:bg-green-700 transition-colors">
                        Registrar entrada
                    </button>
                    <button type="button" onclick="cerrarModal('modal-entrada')"
                            class="px-4 py-2 bg-gray-100 text-gray-600 text-sm font-semibold rounded-lg
                                   hover:bg-gray-200 transition-colors">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal Salida -->
<div id="modal-salida" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md mx-4 overflow-hidden">
        <div class="px-6 py-4 border-b border-red-100 bg-red-50 flex items-center justify-between">
            <h3 class="text-base font-bold text-red-600">▼ Registrar Salida</h3>
            <button onclick="cerrarModal('modal-salida')" class="text-gray-400 hover:text-gray-600 text-xl">✕</button>
        </div>
        <div class="px-6 py-5">
            <form hx-post="/stock/salida" hx-target="#salida-result" hx-swap="innerHTML" class="space-y-4">
                <div class="relative">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Producto</label>
                    <input type="text" id="buscar-salida" placeholder="Buscar por nombre o código…" autocomplete="off"
                           hx-get="/stock/buscar-producto" hx-trigger="keyup changed delay:250ms"
                           hx-target="#sugerencias-salida" hx-swap="innerHTML"
                           name="_buscar_salida"
                           hx-vals='js:{"q": document.getElementById("buscar-salida").value}'
                           class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg
                                  focus:outline-none focus:ring-2 focus:ring-red-400 bg-gray-50">
                    <input type="hidden" name="producto_id" id="producto_id_salida" required>
                    <div id="sugerencias-salida" class="relative"></div>
                    <p id="producto-seleccionado-salida" class="mt-1 text-xs text-red-500 font-semibold hidden"></p>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Cantidad</label>
                        <input type="number" name="cantidad" min="0.01" step="0.01" required
                               class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg
                                      focus:outline-none focus:ring-2 focus:ring-red-400">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Motivo</label>
                        <select name="motivo" required
                                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg
                                       focus:outline-none focus:ring-2 focus:ring-red-400 bg-white">
                            {% for m in motivos_salida %}
                            <option value="{{ m }}">{{ m }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Referencia <span class="text-gray-400 font-normal">(opcional)</span></label>
                    <input type="text" name="referencia" placeholder="Folio, número de caso…"
                           class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg
                                  focus:outline-none focus:ring-2 focus:ring-red-400">
                </div>
                <div id="salida-result"></div>
                <div class="flex gap-3">
                    <button type="submit"
                            class="flex-1 py-2 bg-red-500 text-white text-sm font-semibold rounded-lg
                                   hover:bg-red-600 transition-colors">
                        Registrar salida
                    </button>
                    <button type="button" onclick="cerrarModal('modal-salida')"
                            class="px-4 py-2 bg-gray-100 text-gray-600 text-sm font-semibold rounded-lg
                                   hover:bg-gray-200 transition-colors">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function cerrarModal(id) {
    document.getElementById(id).classList.add('hidden');
}
function seleccionarProducto(id, nombre, stock) {
    // Detectar en cuál modal estamos
    const eEntrada = !document.getElementById('modal-entrada').classList.contains('hidden');
    const suffix = eEntrada ? 'entrada' : 'salida';
    document.getElementById('producto_id_' + suffix).value = id;
    document.getElementById('buscar-' + suffix).value = nombre;
    document.getElementById('sugerencias-' + suffix).innerHTML = '';
    const info = document.getElementById('producto-seleccionado-' + suffix);
    info.textContent = 'Stock actual: ' + stock;
    info.classList.remove('hidden');
}
// Cerrar modal al hacer clic fuera
['modal-entrada','modal-salida'].forEach(id => {
    document.getElementById(id).addEventListener('click', function(e) {
        if (e.target === this) cerrarModal(id);
    });
});
// Enter en buscador selecciona primera sugerencia
['entrada','salida'].forEach(function(suffix) {
    document.getElementById('buscar-' + suffix).addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const firstBtn = document.getElementById('sugerencias-' + suffix).querySelector('button');
            if (firstBtn) firstBtn.click();
        }
    });
});
</script>
