<tbody id="proveedores-body" class="divide-y divide-gray-100">
{% for p in proveedores %}
<tr class="hover:bg-slate-50 transition-colors cursor-pointer"
    onclick="window.location='/catalogos/proveedores/{{ p.id }}'">
    <td class="px-4 py-3">
        <p class="text-sm font-semibold text-gray-800">{{ p.nombre }}</p>
    </td>
    <td class="px-4 py-3 text-sm font-mono text-gray-500">{{ p.rfc or '—' }}</td>
    <td class="px-4 py-3 text-sm text-gray-600">{{ p.contacto or '—' }}</td>
    <td class="px-4 py-3 text-sm text-gray-500">{{ p.telefono or '—' }}</td>
    <td class="px-4 py-3 text-sm text-gray-500">{{ p.email or '—' }}</td>
    <td class="px-4 py-3 text-center">
        <span class="text-sm font-bold {% if p.num_productos %}text-clf-green{% else %}text-gray-300{% endif %}">
            {{ p.num_productos }}
        </span>
    </td>
</tr>
{% else %}
<tr>
    <td colspan="6" class="px-4 py-10 text-center text-sm text-gray-400">
        No se encontraron proveedores.
    </td>
</tr>
{% endfor %}
</tbody>
