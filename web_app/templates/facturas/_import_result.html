{% if error %}
<div class="flex items-start gap-3 bg-red-50 border border-red-200 rounded-xl px-4 py-3 text-sm text-red-700">
    <span class="text-lg">⚠</span>
    <div>
        <p class="font-semibold">Error al importar</p>
        <p class="mt-0.5 text-xs">{{ error }}</p>
    </div>
</div>
{% else %}
<span id="import-ok" class="hidden"></span>
<div class="flex items-start gap-3 bg-green-50 border border-green-200 rounded-xl px-4 py-3 text-sm text-green-700">
    <span class="text-lg">✓</span>
    <div>
        <p class="font-semibold">Factura importada correctamente</p>
        <p class="mt-0.5 text-xs">{{ folio }} · {{ receptor }} · ${{ '{:,.2f}'.format(total) }}</p>
        <a href="/facturas/{{ factura_id }}" class="inline-block mt-2 text-xs font-semibold underline hover:no-underline">
            Ver detalle →
        </a>
    </div>
</div>
{% endif %}
