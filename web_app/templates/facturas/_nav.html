{# Sub-nav de Configuración #}
<div class="bg-[#f0f4fa] border-b border-[#d9e2f0] flex items-center px-5 gap-1 h-9 select-none">
    <a href="/facturas"
       class="px-4 h-full flex items-center text-xs font-semibold transition-colors rounded-t
              {% if seccion == 'facturas' or seccion is not defined %}text-clf-green border-b-2 border-clf-green bg-white
              {% else %}text-navy-400 hover:text-navy-700{% endif %}">
        Facturas
    </a>
    {% if user.rol == 'Administrador' %}
    <a href="/admin/usuarios"
       class="px-4 h-full flex items-center text-xs font-semibold transition-colors rounded-t
              {% if seccion == 'usuarios' %}text-clf-green border-b-2 border-clf-green bg-white
              {% else %}text-navy-400 hover:text-navy-700{% endif %}">
        Usuarios
    </a>
    {% endif %}
</div>
