# nginx/clf_gestion.conf
# Configuracion Nginx para CLF Gestion Web
#
# Instalacion en Windows:
#   1. Descarga Nginx para Windows: https://nginx.org/en/download.html
#   2. Copia este archivo a: nginx/conf/clf_gestion.conf
#   3. En nginx/conf/nginx.conf agrega:  include clf_gestion.conf;
#   4. Reinicia Nginx: nginx -s reload
#
# Con Nginx en lugar de uvicorn directo se obtiene:
#   - Compresion gzip automatica
#   - Cache de archivos estaticos
#   - Mejor manejo de conexiones concurrentes
#   - Logs de acceso separados

upstream clf_app {
    server 127.0.0.1:8000;
    # Escala horizontal: agrega mas servidores aqui si es necesario
    # server 127.0.0.1:8001;
}

# Redirigir HTTP → HTTPS
server {
    listen      80;
    server_name 192.168.0.40 localhost;
    return 301  https://$host$request_uri;
}

# HTTPS principal
server {
    listen      443 ssl;
    server_name 192.168.0.40 localhost;

    # Certificado SSL (autofirmado para red interna)
    ssl_certificate     C:/Users/oscar/OneDrive/Documentos/CLF\ Sistema/Gestion-CLF/ssl/server.crt;
    ssl_certificate_key C:/Users/oscar/OneDrive/Documentos/CLF\ Sistema/Gestion-CLF/ssl/server.key;

    # Protocolos seguros
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Cabeceras de seguridad adicionales
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Archivos estaticos (sirve Nginx directamente, sin pasar a Python)
    location /static/ {
        alias C:/Users/oscar/OneDrive/Documentos/CLF\ Sistema/Gestion-CLF/web_app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Todo lo demas va a FastAPI
    location / {
        proxy_pass         http://clf_app;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Soporte para HTMX (respuestas parciales)
        proxy_buffering    off;
        proxy_read_timeout 120s;
    }

    # Logs
    access_log  logs/clf_access.log;
    error_log   logs/clf_error.log warn;
}
