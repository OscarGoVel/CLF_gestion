name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements_web.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements_web.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check web_app/ core/

      # Los tests de integración requieren PostgreSQL con esquema y usuario admin
      # sembrados. Se ejecutan localmente con `pytest tests/ -v`.
      # TODO: agregar step de seed cuando se configure el runner con fixtures reales.

  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build
        run: npm run build
