name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint & tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: clf
          POSTGRES_PASSWORD: clf_test
          POSTGRES_DB: clf_empresa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CLF_ENV: development
      CLF_SECRET_KEY: ci-test-secret-key-not-for-production
      CLF_PG_USER: clf
      CLF_PG_PASSWORD: clf_test
      CLF_PG_HOST: localhost
      CLF_PG_PORT: 5432
      CLF_PG_DB_USUARIOS: clf_empresa_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements_web.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements_web.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check web_app/ core/

      - name: Run tests
        run: pytest tests/ -v --tb=short

  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build
        run: npm run build
